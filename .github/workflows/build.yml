name: Build DMG

on:
  workflow_dispatch:
    inputs:
      dmg_url:
        description: Meta DMG URL (leave blank for latest)
        type: string
        required: false
      rebuild:
        description: Build again even if an artifact exists
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: build-dmg
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test
        run: python3 -m unittest discover -s tests
      - name: Check version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DMG_URL: ${{ inputs.dmg_url }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          args=()
          if [[ "$REBUILD" == true ]]; then args+=(--rebuild); fi
          python3 src/ci_build.py plan --repository "$REPOSITORY" --dmg-url "$DMG_URL" \
            --output "$RUNNER_TEMP/plan.json" "${args[@]}"
      - name: Prepare packaging
        if: steps.plan.outputs.needs_build == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/dmg-tools"
          "$RUNNER_TEMP/dmg-tools/bin/python" -m pip install --disable-pip-version-check -r packaging/requirements.txt
      - name: Build & verify
        id: build
        if: steps.plan.outputs.needs_build == 'true'
        run: >-
          "$RUNNER_TEMP/dmg-tools/bin/python" src/ci_build.py build --plan "$RUNNER_TEMP/plan.json"
          --output "$RUNNER_TEMP/quest-vd-build" --verify-install
      - name: Save DMG
        id: upload
        if: steps.plan.outputs.needs_build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.build.outputs.dmg }}
          if-no-files-found: error
          retention-days: 7
          archive: false
      - name: Ready
        if: steps.plan.outputs.needs_build == 'true'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          echo "[Download your DMG]($ARTIFACT_URL) · available for 7 days." >> "$GITHUB_STEP_SUMMARY"
          echo 'Drag the app to **Applications**, then follow **Readme** inside the DMG.' >> "$GITHUB_STEP_SUMMARY"
      - name: Clean up
        if: always()
        run: rm -rf "$RUNNER_TEMP/quest-vd-build" "$RUNNER_TEMP/plan.json" "$RUNNER_TEMP/dmg-tools"
