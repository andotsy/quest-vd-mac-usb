 <text x="68" y="588" font-size="12" letter-spacing="1" fill="#62768e">QUEST-VD-MAC-USB</text>
 <text x="1212" y="588" text-anchor="end" font-size="12" fill="#7a8ca4">Independent project · Not affiliated with Meta</text>
