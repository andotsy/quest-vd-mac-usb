 <text x="62" y="265" font-size="94" font-weight="750" letter-spacing="-4" fill="#f0f7ff">Enable USB.</text>
 <text x="67" y="317" font-size="23" fill="#b9c7da">Wired streaming. 120 FPS target.</text>
